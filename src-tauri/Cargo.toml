[package]
name = "mynote"
version = "0.1.0"
description = "X のいいね・ブックマークと Web 記事をローカルに保存してタグで整理するアプリ"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mynote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
url = "2"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
dom_smoothie = "0.18"
ammonia = "4"
encoding_rs = "0.8"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
